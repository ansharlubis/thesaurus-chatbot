<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesaurus Chatbot - Ollama Frontend</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-wrap">
        <div class="chat-container">
            <div class="chat-header">
                <h1>study with me</h1>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message bot-message">
                    <div class="message-content">
                        Hello! I'm your thesaurus chatbot. Ask me about synonyms, antonyms, or word meanings.
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-button">Send</button>
                </div>
            </div>
        </div>
        <div class="model-selector">
            <label for="model-input">Model:</label>
            <input type="text" id="model-input" placeholder="e.g., llama3.2, smollm:360m" value="smollm:360m">
            <button id="update-model-button">Update</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="dist/index.js"></script>
</body>
</html>
