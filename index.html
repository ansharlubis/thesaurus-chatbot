<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesaurus Chatbot - Ollama Frontend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Thesaurus Chatbot</h1>
            <div class="model-selector">
                <label for="model-input">Model:</label>
                <input type="text" id="model-input" placeholder="e.g., llama3.2, smollm:360m" value="smollm:360m">
                <button id="update-model-button">Update</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! I'm your thesaurus chatbot. Ask me about synonyms, antonyms, or word meanings.
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="dist/index.js"></script>
</body>
</html>
